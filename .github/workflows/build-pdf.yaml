name: Generate CV PDF from Markdown

on:
  push:
    branches: [ main ]
    paths: 
      - 'README.md'
  
permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare README for PDF
      run: |
        # Remove PDF download link from README before converting
        sed '/📄.*Download PDF Version/d' README.md > README_for_pdf.md
        
    - name: Convert Markdown to PDF
      uses: baileyjm02/markdown-to-pdf@v1
      with:
        input_path: README_for_pdf.md
        output_dir: ./
        build_html: false
        
    - name: Rename PDF
      run: mv README_for_pdf.pdf Mikhail_Trunov_CV.pdf
    
    - name: Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: cv-latest
        name: Latest CV PDF
        body: 'Auto-generated CV PDF from README.md - Updated on ${{ github.event.head_commit.timestamp }}'
        files: Mikhail_Trunov_CV.pdf
        make_latest: true
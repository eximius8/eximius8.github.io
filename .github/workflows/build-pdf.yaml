name: Generate CV PDF from site

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/index.html'
      - 'scripts/build-pdf.cjs'
      - '.github/workflows/build-pdf.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Playwright Chromium
      run: |
        npm install --no-save playwright@1.49.1
        npx playwright install --with-deps chromium

    - name: Render PDF from docs/index.html (print styles)
      run: node scripts/build-pdf.cjs Mikhail_Trunov_CV.pdf

    - name: Publish PDF to site
      run: |
        cp Mikhail_Trunov_CV.pdf docs/Mikhail_Trunov_CV.pdf
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/Mikhail_Trunov_CV.pdf
        git diff --cached --quiet || git commit -m "Update CV PDF [skip ci]"
        git push

    - name: Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: cv-latest
        name: Latest CV PDF
        body: 'Auto-generated CV PDF from docs/index.html - Updated on ${{ github.event.head_commit.timestamp }}'
        files: Mikhail_Trunov_CV.pdf
        make_latest: true
